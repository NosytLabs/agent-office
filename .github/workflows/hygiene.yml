name: Repository hygiene
on:
  pull_request:
    paths:
      - "**.md"
      - "tools/check_repository.py"
      - ".gitattributes"
      - ".gitignore"
      - ".github/workflows/hygiene.yml"
  push:
    branches: [main]
    # tools/check_repository.py validates tracked files and resolves local Markdown
    # links, so it only has anything to say when .md files or the tracked-file set
    # itself changes. Committing art, screenshots, or code leaves it with nothing to
    # check, and it was burning a runner on every such push to main.
    paths:
      - "**.md"
      - "tools/check_repository.py"
      - ".gitattributes"
      - ".gitignore"
      - ".github/workflows/hygiene.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: hygiene-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check tracked files and local Markdown links
        run: python3 tools/check_repository.py
