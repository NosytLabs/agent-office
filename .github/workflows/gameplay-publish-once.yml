name: Prepare reviewed gameplay fixes
on:
  push:
    branches: [codex/arcade-controls-fix]
    paths: [.ci/gameplay.patch.gz.b64]
permissions:
  contents: read
concurrency:
  group: reviewed-gameplay-publication
  cancel-in-progress: false
jobs:
  prepare:
    if: github.repository == 'NosytLabs/agent-office' && github.ref == 'refs/heads/codex/arcade-controls-fix'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: codex/arcade-controls-fix
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
      - name: Apply the tested five-file patch
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode .ci/gameplay.patch.gz.b64 | gzip --decompress > /tmp/reviewed-gameplay.patch
          echo '584c0330b70ee361ace6b748f64c15c92fe645cfbfa618fdf793a468c5a44ed2  /tmp/reviewed-gameplay.patch' | sha256sum --check
          git apply --check /tmp/reviewed-gameplay.patch
          git apply /tmp/reviewed-gameplay.patch
      - name: Verify source and model regressions
        run: |
          npm ci --ignore-scripts
          npm run check
          npm test
          npx prettier --check web/js/arcade.js web/arcade/duck-hunt/lifecycle.js tests/arcade-model.test.cjs tests/arcade-gameplay.test.cjs
      - name: Publish only the reviewed files to this branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/arcade.md tests/arcade-gameplay.test.cjs tests/arcade-model.test.cjs web/arcade/duck-hunt/lifecycle.js web/js/arcade.js
          git diff --cached --check
          git commit -m 'Fix paddle contacts, primary-pointer input and Duck Hunt pause intent'
          git push origin HEAD:refs/heads/codex/arcade-controls-fix
