name: Studio source snapshot
on:
  push:
    branches: [feat/studio-art-and-office-life]
    paths: [.github/workflows/studio-source-snapshot.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Package public source and test dependencies
        run: |
          tar --exclude=.git -czf "$RUNNER_TEMP/studio-workspace.tar.gz" .
          curl -fL --max-time 40 https://codeload.github.com/marmottajr/habblaud/zip/4ccce2537472fe5a8d432f06974494d2e778ff15 -o "$RUNNER_TEMP/habblaud.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: studio-workspace
          path: |
            ${{ runner.temp }}/studio-workspace.tar.gz
            ${{ runner.temp }}/habblaud.zip
          retention-days: 1
          compression-level: 0
