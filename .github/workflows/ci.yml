name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
      - name: Install development dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements-dev.txt
          npm ci --ignore-scripts
      - name: Python, bridges, and JavaScript checks
        run: |
          python -m pytest -q
          npm run check
          npm test
          npm run format:check
      - name: Use the runner's maintained Chrome
        run: |
          chrome_path="$(command -v google-chrome)"
          "$chrome_path" --version
          echo "CHROMIUM_PATH=$chrome_path" >> "$GITHUB_ENV"
      - name: Verify preserved sprite pixels and public builds
        run: |
          npm run check:sprites
          npm run build:preview
      - name: Browser user flows and screenshots
        run: npm run test:browser
        env:
          OFFICE_SCREENSHOTS: reports/screenshots
      - name: Keep failure or requested browser evidence briefly
        if: failure() || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-evidence
          path: reports
          if-no-files-found: ignore
          retention-days: 3
