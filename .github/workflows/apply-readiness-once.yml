name: Verify observer responsiveness repair
on:
  push:
    branches: [fix/readiness-boundaries-20261022]
    paths: [.github/workflows/apply-readiness-once.yml]
permissions:
  contents: read
jobs:
  verify:
    if: github.actor == 'NosytLabs' && github.repository == 'NosytLabs/agent-office'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Reproduce four failures on the unchanged runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/readiness-evidence
          if python -m pytest -o addopts='' -q tests/test_observer_responsiveness.py --junitxml=/tmp/readiness-evidence/red.xml; then
            echo 'Expected regressions did not reproduce; inspect current source.'
            exit 1
          fi
          python - <<'PY'
          import xml.etree.ElementTree as E
          cases=E.parse('/tmp/readiness-evidence/red.xml').findall('.//testcase')
          assert len(cases)==4
          assert all(case.find('failure') is not None for case in cases)
          assert not any(case.find('error') is not None for case in cases)
          PY
      - name: Apply exact reviewed runtime and architecture patch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:__init__.py)" = 7cb77a8655f16b9a74556e4c8050bf9d77c947f5
          gh api repos/NosytLabs/agent-office/git/blobs/d5a3566e69b2d03780cb851758359aef1718f33a --jq .content | base64 --decode > /tmp/readiness-evidence/repair.patch
          echo 'cbcf702b30727505c18328f980ec42a960588034c3f9bbf49e5a836fcbb0d195  /tmp/readiness-evidence/repair.patch' | sha256sum -c -
          git apply --check /tmp/readiness-evidence/repair.patch
          git apply /tmp/readiness-evidence/repair.patch
      - name: Run full Python suite and repository checks
        run: |
          python -m pytest -o addopts='' -q --junitxml=/tmp/readiness-evidence/green.xml
          python tools/check_repository.py
          git diff --check
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: observer-responsiveness-evidence
          path: /tmp/readiness-evidence
          retention-days: 7
          if-no-files-found: error
  publish:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: observer-responsiveness-evidence
          path: /tmp/readiness-evidence
      - name: Publish verified source to the working branch only
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          echo 'cbcf702b30727505c18328f980ec42a960588034c3f9bbf49e5a836fcbb0d195  /tmp/readiness-evidence/repair.patch' | sha256sum -c -
          git apply --check /tmp/readiness-evidence/repair.patch
          git apply /tmp/readiness-evidence/repair.patch
          git rm .github/workflows/readiness-source-once.yml .github/workflows/apply-readiness-once.yml
          git add __init__.py docs/architecture.md
          git config user.name 'Nosyt Labs'
          git config user.email 'hi@nosytlabs.com'
          git commit -m 'fix: keep observer bootstrap responsive during slow ingestion'
          askpass="$(mktemp)"
          trap 'rm -f "$askpass"' EXIT
          printf '%s\n' '#!/bin/sh' 'case "$1" in *Username*) printf "%s\n" x-access-token;; *) printf "%s\n" "$GH_TOKEN";; esac' > "$askpass"
          chmod 700 "$askpass"
          GIT_ASKPASS="$askpass" GIT_TERMINAL_PROMPT=0 git -c credential.helper= push origin HEAD:refs/heads/fix/readiness-boundaries-20261022
