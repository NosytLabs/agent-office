name: Readiness investigation source
on:
  push:
    branches: [fix/readiness-boundaries-20261022]
    paths: [.github/workflows/readiness-source-once.yml]
permissions:
  contents: read
jobs:
  source:
    if: github.actor == 'NosytLabs' && github.repository == 'NosytLabs/agent-office'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm
      - name: Preserve tracked source and locked development tools only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/readiness-source"
          git archive --format=tar.gz -o "${RUNNER_TEMP}/readiness-source/source.tar.gz" HEAD
          git rev-parse HEAD > "${RUNNER_TEMP}/readiness-source/revision.txt"
          npm ci --ignore-scripts --no-audit --no-fund
          tar -czf "${RUNNER_TEMP}/readiness-source/dev-tools.tar.gz" node_modules
          sha256sum package-lock.json > "${RUNNER_TEMP}/readiness-source/lock.sha256"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: readiness-source
          path: ${{ runner.temp }}/readiness-source
          retention-days: 1
          if-no-files-found: error
