name: Product website
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "tools/build_site.mjs"
      - "docs/screenshots/**"
      - "web/assets/**"
      - "LICENSE"
      - ".github/workflows/pages.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: product-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      pages_enabled: ${{ steps.pages-status.outputs.enabled }}
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Check whether Pages is enabled
        id: pages-status
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync } from 'node:fs';
          const response = await fetch(`https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}`, {
            headers: { Authorization: `Bearer ${process.env.GITHUB_TOKEN}`, Accept: 'application/vnd.github+json' },
            signal: AbortSignal.timeout(15000),
          });
          if (!response.ok) throw new Error(`Could not read repository metadata: HTTP ${response.status}`);
          const repository = await response.json();
          const enabled = repository.has_pages === true;
          appendFileSync(process.env.GITHUB_OUTPUT, `enabled=${enabled}\n`);
          if (!enabled) appendFileSync(process.env.GITHUB_STEP_SUMMARY,
            '### Product website\nThe static build runs below. Pages deployment is skipped because Pages is not enabled. Select **Settings → Pages → Source: GitHub Actions**, then run this workflow again.\n');
          NODE
      # Select GitHub Actions in Settings > Pages before the first deployment.
      # This workflow does not change the repository's publishing/access settings.
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        if: steps.pages-status.outputs.enabled == 'true'
      - name: Build the public product website
        run: node tools/build_site.mjs
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        if: steps.pages-status.outputs.enabled == 'true'
        with:
          path: site-dist
          retention-days: 1
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && needs.build.outputs.pages_enabled == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish product website
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
