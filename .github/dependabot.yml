version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    # One grouped PR per week instead of one PR per package.
    groups:
      npm-dependencies:
        patterns:
          - "*"
    # Playwright stays pinned at 1.63.0 in this repo - never propose bumps.
    ignore:
      - dependency-name: "playwright"
      - dependency-name: "@playwright/test"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"
